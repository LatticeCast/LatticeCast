global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Postgres internals: connections, locks, table/index size, pg_stat_statements.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Aggregated across uvicorn workers on a dedicated port (never routed via nginx).
  # Keep route templates as labels; never workspace_id / user_id / raw URLs.
  - job_name: lattice-cast-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:9100"]
