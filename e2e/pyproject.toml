[project]
name = "e2e"
version = "0.93.1"
description = "LatticeCast e2e — Playwright drives UI (browsers in separate `browser` container, connected via WS); requests for BE API + DB content."
requires-python = ">=3.12"
dependencies = [
    "playwright==1.50.0",
    "pytest>=8.0",
    "requests",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Import placement only: every import at the head of the file.
select = [
    "E402",    # module-level import after code
    "PLC0415", # import inside a function
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py", "e2e_test_*.py"]
python_functions = ["test_*"]
