[project]
name = "lattice-cast-backend"
version = "0.91.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-multipart",
    "pydantic[email]",
    "pydantic-settings",
    "sqlmodel",          # pulls sqlalchemy + pydantic
    "sqlalchemy[asyncio]", # async engine requires greenlet at runtime
    "asyncpg",
    "python-jose",
    "passlib",
    "bcrypt==4.0.1",  # verified with passlib 1.7.4; without a bcrypt package passlib uses libc crypt, which holds the GIL
    "aioboto3",
    "prometheus-client",
    "lattice-ql @ git+https://github.com/latticeCast/LatticeQL@0.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # Depends() in default args is standard FastAPI pattern
]

[tool.ruff.format]
quote-style = "double"
